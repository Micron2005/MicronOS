<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#232a33;--ink:#e6edf3;--dim:#8b95a1;--accent:#4C8DFF}
  html[data-theme="light"]{--bg:#f4f5f7;--panel:#fff;--line:#dfe3e8;--ink:#1b2027;--dim:#5a6472}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;font:14px system-ui,sans-serif}
  #bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
  #bar input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:5px;padding:6px 10px;font-family:ui-monospace,monospace;font-size:13px}
  #bar button{background:var(--accent);border:none;color:#fff;border-radius:5px;padding:6px 16px;cursor:pointer}
  #bar #openbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
  #ta{flex:1;background:var(--bg);color:var(--ink);border:none;outline:none;resize:none;
    padding:14px;font-family:ui-monospace,monospace;font-size:13px;line-height:1.6}
  #status{padding:5px 12px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);font-family:ui-monospace,monospace}
</style></head><body>
<div id="bar"><input id="path" placeholder="path relative to home, e.g. notes.txt">
  <button id="openbtn">Open</button><button id="savebtn">Save</button></div>
<textarea id="ta" spellcheck="false" placeholder="A plain text editor."></textarea>
<div id="status">Ready.</div>
<script>
  try{const t=localStorage.getItem('micron.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
  const path=document.getElementById('path'), ta=document.getElementById('ta'), st=document.getElementById('status');
  addEventListener('message',e=>{ if(e.data&&e.data.micronOpen==='editor'&&e.data.path){ path.value=e.data.path; open_(); }});
  async function open_(){
    if(!path.value){ st.textContent='Enter a path.'; return; }
    const r=await fetch('/api/files/read?path='+encodeURIComponent(path.value));
    if(!r.ok){ st.textContent='Cannot open (new file will be created on save).'; ta.value=''; return; }
    const d=await r.json();
    if(d.binary){ st.textContent='Binary file — not editable.'; ta.value=''; return; }
    ta.value=d.text; st.textContent='Opened ~/'+d.path;
  }
  async function save_(){
    if(!path.value){ st.textContent='Enter a path to save.'; return; }
    const r=await fetch('/api/files/write',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({path:path.value,text:ta.value})});
    const d=await r.json().catch(()=>({}));
    st.textContent=r.ok?('Saved ~/'+d.path+' ('+d.bytes+' bytes)'):('Save failed: '+(d.error||''));
  }
  document.getElementById('openbtn').onclick=open_;
  document.getElementById('savebtn').onclick=save_;
  addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save_();}});
</script></body></html>
