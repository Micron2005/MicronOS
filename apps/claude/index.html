<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#232a33;--ink:#e6edf3;--dim:#8b95a1;--accent:#4C8DFF}
  html[data-theme="light"]{--bg:#f4f5f7;--panel:#fff;--line:#dfe3e8;--ink:#1b2027;--dim:#5a6472}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;
    font:14px system-ui,sans-serif}
  #setup{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  #setup .card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:26px}
  #setup h1{font-size:16px;letter-spacing:.12em;color:var(--accent);margin-bottom:10px}
  #setup p{color:var(--dim);font-size:13px;line-height:1.6;margin-bottom:14px}
  #setup input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:10px 12px;font-family:ui-monospace,monospace;font-size:12px;margin-bottom:12px}
  #setup button{background:var(--accent);border:none;color:#fff;border-radius:6px;
    padding:10px 20px;cursor:pointer}
  #chat{flex:1;display:none;flex-direction:column;min-height:0}
  #log{flex:1;overflow-y:auto;padding:18px 20px}
  .turn{margin-bottom:16px;max-width:56em}
  .turn .who{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
  .turn.claude .who{color:var(--accent)}
  .turn .body{line-height:1.65;white-space:pre-wrap}
  #bar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  #msg{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:10px 14px;font-size:14px}
  #msg:focus{outline:none;border-color:var(--accent)}
  #send{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:0 20px;cursor:pointer}
  #topline{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);
    font-size:12px;color:var(--dim)}
  #topline label{display:flex;gap:6px;align-items:center;cursor:pointer}
  #topline .sp{flex:1}
  #keybtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:5px;
    padding:4px 10px;cursor:pointer;font-size:11px}
  #thinking{display:none;color:var(--dim);font-size:12px;padding:0 20px 10px;font-style:italic}
</style></head><body>
<div id="setup"><div class="card">
  <h1>C L A U D E</h1>
  <p>This app talks to Claude at Anthropic — it needs internet and your own
  API key (console.anthropic.com &rarr; API keys). The key is stored only on
  this machine, and usage is billed to your Anthropic account.</p>
  <input id="key" type="password" placeholder="sk-ant-...">
  <button id="save">Start talking</button>
</div></div>
<div id="chat">
  <div id="topline">
    <label><input type="checkbox" id="house" checked> introduce the house (tell Claude this is Micron OS)</label>
    <span class="sp"></span>
    <button id="keybtn">Change key</button>
  </div>
  <div id="log"></div>
  <div id="thinking">Claude is thinking&hellip;</div>
  <div id="bar">
    <input id="msg" placeholder="Talk to Claude&hellip;" autocomplete="off">
    <button id="send">Send</button>
  </div>
</div>
<script>
  try{const t=localStorage.getItem('micron.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
  const K='micron.claude.key';
  const history=[];
  const HOUSE='You are Claude, running as a preinstalled app inside Micron OS \u2014 a '+
    'self-built operating system made by its owner with a local AI butler named Alfred '+
    '(a separate program; you are the cloud consultant, he is the local butler). Be '+
    'concise and genuinely useful. The owner built this OS from Debian parts with a '+
    'custom shell; apps run in windows; you are one of its apps.';
  function show(which){ document.getElementById('setup').style.display = which==='setup'?'flex':'none';
    document.getElementById('chat').style.display = which==='chat'?'flex':'none'; }
  function turn(who, text){
    const d=document.createElement('div'); d.className='turn '+(who==='Claude'?'claude':'');
    const w=document.createElement('div'); w.className='who'; w.textContent=who;
    const b=document.createElement('div'); b.className='body'; b.textContent=text;
    d.appendChild(w); d.appendChild(b);
    const log=document.getElementById('log'); log.appendChild(d); log.scrollTop=log.scrollHeight;
  }
  async function send(){
    const inp=document.getElementById('msg'); const text=inp.value.trim(); if(!text) return;
    inp.value=''; turn('You', text);
    history.push({role:'user', content:text});
    document.getElementById('thinking').style.display='block';
    try{
      const body={model:'claude-sonnet-4-6', max_tokens:1500, messages:history};
      if(document.getElementById('house').checked) body.system=HOUSE;
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
        'Content-Type':'application/json',
        'x-api-key':localStorage.getItem(K)||'',
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },body:JSON.stringify(body)});
      const d=await r.json();
      if(!r.ok){ history.pop();
        const msg=(d.error&&d.error.message)||('HTTP '+r.status);
        turn('Claude', r.status===401?'That key was rejected \u2014 check it via "Change key".'
          : 'Could not reach Anthropic: '+msg+(navigator.onLine?'':' (you appear to be offline)'));
      } else {
        const reply=(d.content||[]).map(c=>c.text||'').join('');
        history.push({role:'assistant', content:reply});
        turn('Claude', reply);
      }
    }catch(e){ history.pop(); turn('Claude','No connection to Anthropic \u2014 this app needs internet. ('+e.message+')'); }
    document.getElementById('thinking').style.display='none';
  }
  document.getElementById('save').onclick=()=>{
    const k=document.getElementById('key').value.trim();
    if(!k) return;
    try{ localStorage.setItem(K,k); }catch(e){}
    show('chat');
    turn('Claude','Hello \u2014 Claude here, resident consultant of Micron OS. What are we working on?');
    document.getElementById('msg').focus();
  };
  document.getElementById('keybtn').onclick=()=>{ show('setup'); };
  document.getElementById('send').onclick=send;
  document.getElementById('msg').addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
  if(localStorage.getItem(K)){ show('chat');
    turn('Claude','Hello \u2014 Claude here, resident consultant of Micron OS. What are we working on?'); }
  else show('setup');
</script></body></html>
