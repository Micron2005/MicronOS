<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --bg:#0d1117; --panel:#161b22; --line:#232a33; --ink:#e6edf3;
         --dim:#8b95a1; --accent:#4C8DFF; }
  html[data-theme="light"]{ --bg:#f4f5f7; --panel:#fff; --line:#dfe3e8;
         --ink:#1b2027; --dim:#5a6472; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);height:100vh;display:flex;
    flex-direction:column;font:15px system-ui,sans-serif;padding:14px}
  #screen{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:18px 16px;text-align:right;margin-bottom:12px;min-height:76px;
    display:flex;flex-direction:column;justify-content:flex-end}
  #expr{color:var(--dim);font-size:13px;font-family:ui-monospace,monospace;
    min-height:16px;word-break:break-all}
  #out{font-size:32px;font-family:ui-monospace,monospace;word-break:break-all}
  #pad{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);font-size:18px;cursor:pointer;transition:.1s}
  button:hover{border-color:var(--accent)}
  button:active{background:var(--accent);color:#fff}
  .op{color:var(--accent)}
  .eq{background:var(--accent);color:#fff;border-color:var(--accent)}
  .fn{color:var(--dim);font-size:15px}
</style></head><body>
<div id="screen"><div id="expr"></div><div id="out">0</div></div>
<div id="pad"></div>
<script>
  // theme inherit from the shell's saved choice
  try { const t = localStorage.getItem('micron.theme');
        if (t) document.documentElement.setAttribute('data-theme', t); } catch(e){}
  const keys = [['AC','fn'],['\u00b1','fn'],['%','fn'],['\u00f7','op'],
    ['7',''],['8',''],['9',''],['\u00d7','op'],
    ['4',''],['5',''],['6',''],['\u2212','op'],
    ['1',''],['2',''],['3',''],['+','op'],
    ['0',''],['.',''],['\u232b','fn'],['=','eq']];
  let expr = '', out = '0';
  const pad = document.getElementById('pad');
  const opmap = {'\u00f7':'/','\u00d7':'*','\u2212':'-','+':'+'};
  function render(){ document.getElementById('expr').textContent = expr;
    document.getElementById('out').textContent = out; }
  function evalExpr(){
    try {
      let e = expr.replace(/[\u00f7\u00d7\u2212]/g, m => opmap[m]).replace(/%/g,'/100');
      if (!e) return;
      // guard: only allow numbers, operators, parens, dot
      if (!/^[0-9+\-*/.() ]+$/.test(e)) { out = 'Error'; return; }
      let r = Function('"use strict";return (' + e + ')')();
      out = (Math.round(r * 1e10) / 1e10).toString();
    } catch(e){ out = 'Error'; }
  }
  for (const [k, cls] of keys){
    const b = document.createElement('button'); b.textContent = k;
    if (cls) b.className = cls;
    b.onclick = () => {
      if (k === 'AC'){ expr = ''; out = '0'; }
      else if (k === '\u232b'){ expr = expr.slice(0, -1); }
      else if (k === '='){ evalExpr(); expr = out === 'Error' ? '' : out; }
      else if (k === '\u00b1'){ if (expr) expr = expr.startsWith('-') ? expr.slice(1) : '-' + expr; }
      else { if (out !== '0' && !expr) expr = ''; expr += k; out = expr; }
      render();
    };
    pad.appendChild(b);
  }
  render();
  addEventListener('keydown', e => {
    const map = {'/':'\u00f7','*':'\u00d7','-':'\u2212'};
    if (/[0-9.+]/.test(e.key)) { if(!expr && out!=='0'){} expr += e.key; out = expr; }
    else if (map[e.key]) { expr += map[e.key]; out = expr; }
    else if (e.key === 'Enter' || e.key === '='){ evalExpr(); expr = out==='Error'?'':out; }
    else if (e.key === 'Backspace'){ expr = expr.slice(0,-1); }
    else if (e.key === 'Escape'){ expr=''; out='0'; }
    else return;
    render();
  });
</script></body></html>
