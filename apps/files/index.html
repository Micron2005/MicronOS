<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#232a33;--ink:#e6edf3;--dim:#8b95a1;--accent:#4C8DFF}
  html[data-theme="light"]{--bg:#f4f5f7;--panel:#fff;--line:#dfe3e8;--ink:#1b2027;--dim:#5a6472}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;
    font:14px system-ui,sans-serif}
  #bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
  #up{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:5px;
    padding:5px 12px;cursor:pointer}
  #path{font-family:ui-monospace,monospace;color:var(--dim);font-size:13px}
  #list{flex:1;overflow-y:auto;padding:8px}
  .row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;cursor:pointer}
  .row:hover{background:var(--panel)}
  .row .ic{width:18px;text-align:center}
  .row .sz{margin-left:auto;color:var(--dim);font-size:12px;font-family:ui-monospace,monospace}
  .dir{color:var(--accent)}
  .empty{color:var(--dim);padding:20px;text-align:center;font-style:italic}
</style></head><body>
<div id="bar"><button id="up">↑ Up</button><span id="path">~</span></div>
<div id="list"></div>
<script>
  try{const t=localStorage.getItem('micron.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
  let cur = "";
  function human(n){ if(n==null)return""; const u=['B','KB','MB','GB'];let i=0;
    while(n>=1024&&i<3){n/=1024;i++;} return (i?n.toFixed(1):n)+u[i]; }
  async function load(rel){
    const r = await fetch('/api/files/list?path=' + encodeURIComponent(rel));
    if(!r.ok){ document.getElementById('list').innerHTML='<div class="empty">Cannot open.</div>'; return; }
    const d = await r.json(); cur = d.path;
    document.getElementById('path').textContent = '~/' + (d.path || '');
    const box = document.getElementById('list'); box.replaceChildren();
    if(!d.entries.length){ box.innerHTML='<div class="empty">Empty folder.</div>'; return; }
    for(const e of d.entries){
      const row=document.createElement('div'); row.className='row';
      row.innerHTML='<span class="ic '+(e.dir?'dir':'')+'">'+(e.dir?'▸':'◦')+'</span>'+
        '<span class="'+(e.dir?'dir':'')+'"></span><span class="sz">'+human(e.size)+'</span>';
      row.querySelector('span:nth-child(2)').textContent=e.name;
      row.onclick=()=>{ const next=(cur?cur+'/':'')+e.name;
        if(e.dir) load(next);
        else { try{ window.parent.postMessage({micronOpen:'editor',path:next},'*'); }catch(x){}
               alert('Open in Editor: ~/'+next); } };
      box.appendChild(row);
    }
  }
  document.getElementById('up').onclick=()=>{ if(!cur)return;
    load(cur.split('/').slice(0,-1).join('/')); };
  load("");
</script></body></html>
